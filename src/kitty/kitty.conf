cursor_shape block
font_family CommitMono Nerd Font Mono
font_size 13
initial_window_height 1000c
initial_window_width 1000c
macos_show_window_title_in window
macos_titlebar_color background
map shift+enter send_text all \x1b[13;2u
modify_font baseline 5px
modify_font cell_height -5px
placement_strategy top-left
remember_window_size no
shell_integration no-cursor no-cwd
text_composition_strategy legacy
window_padding_width 2

include catppuccin-latte.conf
